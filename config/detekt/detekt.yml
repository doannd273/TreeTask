build:
  maxIssues: 0
naming:
  FunctionNaming:
    ignoreAnnotated: [ 'Composable' ] # Cực kỳ quan trọng: Bỏ qua hàm Compose viết hoa
style:
  MagicNumber:
    active: false # Cho phép hardcode số tạm thời
  MaxLineLength:
    active: false # Tránh chửi khi viết Compose bị thụt lùi quá sâu
  ReturnCount:
    max: 10 # Mapper guard clauses cần fail-fast rõ ràng
  UnusedPrivateMember:
    ignoreAnnotated: [ 'Preview', 'AppPreviewLight', 'AppPreviewLightDark', 'AppPreviewLocalesLightDark' ]

exceptions:
  TooGenericExceptionCaught:
    active: false # Cho phép catch Exception ở các boundary có chủ đích

performance:
  SpreadOperator:
    active: false # Cho phép dùng *args trong hàm getString() của Android

complexity:
  LongParameterList:
    functionThreshold: 20
    ignoreDefaultParameters: true
  LongMethod:
    threshold: 80
    ignoreAnnotated: [ 'Composable' ]
  TooManyFunctions:
    ignoreAnnotatedFunctions: [ 'Preview', 'AppPreviewLight', 'AppPreviewLightDark', 'AppPreviewLocalesLightDark' ]
